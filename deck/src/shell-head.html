<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>untype — Voice to text for macOS · Technical deck</title>
<style>
  :root {
    --ink: #003841;
    --teal: #007B85;
    --bright: #00ADBF;
    --cyan: #00CFE7;
    --black: #0A1416;
    --grey-1: #BEC1BE;
    --grey-2: #939793;
    --cream: #F5F8F6;
    --paper: #FFFFFF;
    --body: #1A1F22;
    --sans: "Aptos", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--black); overflow: hidden; font-family: var(--sans); }

  /* ---- viewport frame + scaled 1920x1080 stage ---- */
  #frame { position: fixed; inset: 0; overflow: hidden; background: var(--black); }
  #stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--body); display: none; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .slide.active { display: block; }

  /* ---- navigation chrome (outside the slides) ---- */
  #nav { position: fixed; right: 18px; bottom: 14px; display: flex; gap: 6px; align-items: center; z-index: 50; font-family: var(--sans); opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  #nav.show { opacity: 1; pointer-events: auto; }
  #nav button { border: 0; background: rgba(245,248,246,0.10); color: rgba(245,248,246,0.85); width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  #nav button:hover { background: rgba(0,207,231,0.25); }
  #nav .counter { color: rgba(245,248,246,0.6); font-size: 13px; padding: 0 8px; font-variant-numeric: tabular-nums; }
  #progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--cyan); width: 0; z-index: 50; transition: width .2s ease; }

  /* ---- shared slide primitives (artboard px) ---- */
  .eyebrow { position: absolute; top: 70px; left: 90px; font-size: 16px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .title { position: absolute; top: 110px; left: 90px; right: 90px; font-size: 56px; font-weight: 300; line-height: 1.05; letter-spacing: -1px; color: var(--ink); text-wrap: balance; }
  .title em { font-style: italic; font-weight: 400; color: var(--teal); }
  .rule { position: absolute; top: 290px; left: 90px; width: 60px; height: 3px; background: var(--teal); }
  .body { position: absolute; top: 340px; left: 90px; right: 90px; font-size: 22px; line-height: 1.55; color: rgba(26,31,34,0.85); }
  .body p { margin: 0 0 22px; text-wrap: pretty; }
  .body ul { margin: 0; padding-left: 26px; }
  .body li { margin: 0 0 12px; text-wrap: pretty; }
  .body li::marker { color: var(--bright); }
  .lead { font-size: 26px; line-height: 1.45; color: var(--ink); }
  .muted { color: rgba(26,31,34,0.6); }
  .note { position: absolute; left: 90px; right: 90px; bottom: 110px; font-size: 15px; line-height: 1.4; color: rgba(26,31,34,0.55); }
  code, .k { font-family: var(--mono); font-size: 0.92em; background: rgba(0,56,65,0.07); color: var(--ink); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .dark code, .dark .k { background: rgba(255,255,255,0.12); color: var(--cream); }

  .footer { position: absolute; left: 54px; right: 54px; bottom: 36px; display: flex; align-items: center; justify-content: space-between; color: rgba(0,56,65,0.55); font-size: 18px; letter-spacing: .4px; }
  .footer .brand { display: flex; align-items: center; gap: 18px; }
  .footer .brand img { height: 28px; width: auto; display: block; }
  .footer .brand span { opacity: .7; }
  .footer .pg { font-variant-numeric: tabular-nums; font-weight: 600; }
  .dark .footer { color: rgba(255,255,255,0.7); }

  /* ---- layout helpers ---- */
  .grid { position: absolute; top: 340px; left: 90px; right: 90px; display: grid; gap: 40px; }
  .grid.g2 { grid-template-columns: repeat(2, 1fr); }
  .grid.g3 { grid-template-columns: repeat(3, 1fr); }
  .grid.g4 { grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .col .n { font-size: 64px; font-weight: 200; color: var(--teal); line-height: 1; letter-spacing: -2px; }
  .col h3 { margin: 22px 0 0; font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .col p { margin: 14px 0 0; font-size: 18px; line-height: 1.55; color: rgba(26,31,34,0.78); text-wrap: pretty; }
  .col ul { margin: 14px 0 0; padding-left: 22px; font-size: 18px; line-height: 1.5; color: rgba(26,31,34,0.78); }
  .col li { margin-bottom: 8px; }
  .col li::marker { color: var(--bright); }

  .card { background: var(--paper); border: 1px solid rgba(0,56,65,0.12); border-radius: 16px; padding: 30px 32px; box-shadow: 0 12px 40px -24px rgba(0,56,65,0.25); }
  .card.tint { background: var(--cream); border-color: transparent; }
  .card.ink { background: var(--ink); color: var(--cream); border-color: transparent; }
  .card h3 { margin: 0; font-size: 24px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .card.ink h3 { color: var(--cyan); }
  .card p { margin: 12px 0 0; font-size: 18px; line-height: 1.5; color: rgba(26,31,34,0.8); }
  .card.ink p { color: rgba(245,248,246,0.85); }
  .card ul { margin: 12px 0 0; padding-left: 22px; font-size: 18px; line-height: 1.5; color: rgba(26,31,34,0.8); }
  .card.ink ul { color: rgba(245,248,246,0.85); }
  .card li { margin-bottom: 8px; }
  .card li::marker { color: var(--bright); }
  .card .tag { display: inline-block; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); font-weight: 700; margin-bottom: 10px; }
  .card.ink .tag { color: var(--cyan); }
  .card.ink code { background: rgba(255,255,255,0.14); color: var(--cream); }

  .image-right { position: absolute; top: 0; right: 0; width: 760px; height: 1080px; overflow: hidden; background-size: cover; background-position: center; }
  .image-right::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 18%); }
  .with-image .title, .with-image .body, .with-image .note { right: 840px; }
  .with-image .grid { right: 840px; }
  .with-image .footer { right: 814px; }

  .kv { position: absolute; top: 340px; left: 90px; right: 90px; }
  .kv .row { display: grid; grid-template-columns: 420px 1fr; gap: 40px; padding: 18px 0; border-bottom: 1px solid rgba(0,56,65,0.12); font-size: 20px; line-height: 1.45; align-items: baseline; }
  .kv .row:last-child { border-bottom: 0; }
  .kv .key { font-family: var(--mono); font-size: 18px; color: var(--ink); font-weight: 600; }
  .kv .val { color: rgba(26,31,34,0.85); }

  table.t { position: absolute; top: 340px; left: 90px; right: 90px; width: 1740px; border-collapse: collapse; font-size: 19px; line-height: 1.4; }
  table.t th { text-align: left; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); font-weight: 700; padding: 0 18px 14px 0; border-bottom: 2px solid var(--ink); }
  table.t td { padding: 14px 18px 14px 0; border-bottom: 1px solid rgba(0,56,65,0.12); vertical-align: top; color: rgba(26,31,34,0.85); }
  table.t td.k { font-family: var(--mono); font-size: 17px; color: var(--ink); font-weight: 600; background: none; padding-left: 0; white-space: nowrap; }
  table.t.compact td { padding-top: 10px; padding-bottom: 10px; font-size: 17px; }
  table.t.compact td.k { font-size: 15px; }

  pre.code { position: absolute; margin: 0; font-family: var(--mono); font-size: 19px; line-height: 1.6; color: var(--cream); background: var(--ink); border-radius: 16px; padding: 30px 36px; white-space: pre; overflow: hidden; }
  pre.code .c { color: rgba(245,248,246,0.5); }
  pre.code .h { color: var(--cyan); }
  pre.code .g { color: #8BE8C8; }

  .tree { font-family: var(--mono); font-size: 19px; line-height: 1.7; color: var(--ink); white-space: pre; }
  .tree .d { color: var(--teal); font-weight: 600; }
  .tree .m { color: rgba(26,31,34,0.55); }

  .pill { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(0,173,191,0.14); color: var(--ink); font-size: 16px; font-weight: 600; letter-spacing: .3px; margin: 0 8px 8px 0; }
  .pill.on { background: var(--ink); color: var(--cream); }

  .callout { position: absolute; left: 90px; right: 90px; bottom: 120px; background: var(--cream); border-left: 6px solid var(--bright); border-radius: 0 14px 14px 0; padding: 22px 30px; font-size: 20px; line-height: 1.5; color: var(--ink); }
  .callout.warn { border-left-color: var(--ink); background: rgba(0,56,65,0.06); }
  .callout strong { font-weight: 700; }

  .steps { position: absolute; top: 340px; left: 90px; right: 90px; display: grid; gap: 22px; }
  .step { display: grid; grid-template-columns: 72px 1fr; gap: 24px; align-items: start; }
  .step .n { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--cyan); font-size: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .step h3 { margin: 6px 0 0; font-size: 24px; font-weight: 600; color: var(--ink); }
  .step p { margin: 6px 0 0; font-size: 18px; line-height: 1.5; color: rgba(26,31,34,0.8); }

  .stat { position: absolute; top: 360px; left: 90px; }
  .stat .big { font-size: 220px; font-weight: 200; letter-spacing: -8px; line-height: .9; color: var(--ink); }
  .stat .big span { color: var(--bright); }
  .stat .cap { margin-top: 24px; font-size: 26px; color: var(--ink); max-width: 720px; line-height: 1.3; }
  .stat-list { position: absolute; top: 380px; right: 90px; width: 740px; }
  .stat-list .row { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0; border-bottom: 1px solid rgba(0,56,65,0.12); }
  .stat-list .row span:first-child { font-size: 20px; color: rgba(0,56,65,0.7); }
  .stat-list .row span:last-child { font-size: 30px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---- covers & dividers ---- */
  .cover { background: var(--black); color: var(--cream); }
  .cover .photo { position: absolute; top: 100px; right: 60px; width: 720px; height: 880px; border-radius: 18px; overflow: hidden; background-size: cover; background-position: center; }
  .cover .fade { position: absolute; top: 0; right: 780px; width: 240px; height: 100%; background: linear-gradient(90deg, transparent 0%, var(--black) 100%); }
  .cover .copy { position: absolute; top: 220px; left: 90px; max-width: 940px; }
  .cover h1 { margin: 0; font-size: 92px; line-height: .95; font-weight: 300; letter-spacing: -1.5px; color: var(--cream); text-wrap: balance; }
  .cover h1 span { color: var(--cyan); }
  .cover .sub { margin-top: 56px; font-size: 28px; font-weight: 400; opacity: .86; line-height: 1.3; max-width: 900px; }
  .cover .meta { margin-top: 80px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; letter-spacing: .4px; opacity: .78; }
  .cover .logo { position: absolute; left: 90px; bottom: 80px; }
  .cover .logo img { height: 56px; width: auto; display: block; }

  .divider { background: var(--ink); color: var(--cream); }
  .divider .photo { position: absolute; top: 100px; right: 60px; width: 1100px; height: 880px; border-radius: 24px; overflow: hidden; background-size: cover; background-position: center; }
  .divider .num { position: absolute; top: 360px; left: 80px; font-size: 220px; font-weight: 200; line-height: 1; letter-spacing: -8px; color: var(--cyan); }
  .divider .label { position: absolute; top: 600px; left: 90px; width: 600px; font-size: 64px; font-weight: 300; line-height: 1; letter-spacing: -1px; color: var(--cream); }
  .divider .cap { position: absolute; top: 700px; left: 90px; width: 600px; font-size: 22px; line-height: 1.4; color: rgba(245,248,246,0.7); }

  .divider-dark { background: var(--ink); color: var(--cream); }
  .divider-dark .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--cyan); }
  .divider-dark .num { position: absolute; top: 380px; left: 90px; font-size: 260px; font-weight: 200; line-height: 1; letter-spacing: -10px; color: var(--cyan); }
  .divider-dark .label { position: absolute; top: 410px; left: 580px; right: 90px; font-size: 84px; font-weight: 300; line-height: 1; letter-spacing: -2px; color: var(--cream); text-wrap: balance; }
  .divider-dark .cap { position: absolute; top: 580px; left: 580px; right: 90px; font-size: 26px; line-height: 1.4; color: rgba(245,248,246,0.7); max-width: 760px; }

  .bright-bg { background: var(--cream); }
  .bright-bg .field { position: absolute; right: 0; bottom: 0; width: 720px; height: 720px; background: var(--bright); border-top-left-radius: 24px; }

  /* ---- pipeline diagram ---- */
  .flow { position: absolute; top: 330px; left: 90px; right: 90px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; align-items: stretch; }
  .flow .node { background: var(--cream); border-radius: 16px; padding: 22px 22px 24px; position: relative; min-height: 250px; }
  .flow .node.hot { background: var(--ink); color: var(--cream); }
  .flow .node .i { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .flow .node.hot .i { color: var(--cyan); }
  .flow .node h4 { margin: 10px 0 0; font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .flow .node.hot h4 { color: var(--cream); }
  .flow .node p { margin: 10px 0 0; font-size: 16px; line-height: 1.45; color: rgba(26,31,34,0.75); }
  .flow .node.hot p { color: rgba(245,248,246,0.8); }
  .flow .node .t { margin-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--teal); line-height: 1.4; word-break: break-word; }
  .flow .node.hot .t { color: var(--cyan); }
  .flow .node.hot code { background: rgba(255,255,255,0.14); color: var(--cream); }
  .flow .node::after { content: "→"; position: absolute; right: -18px; top: 46%; color: var(--bright); font-size: 26px; font-weight: 700; }
  .flow .node:last-child::after { content: none; }
</style>
</head>
<body>
<div id="frame"><div id="stage">
